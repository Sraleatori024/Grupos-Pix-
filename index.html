    <script>
      (function () {
        try {
          var nativeFetch = typeof window !== 'undefined' ? window.fetch : null;
          var _currentFetch = nativeFetch ? nativeFetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return _currentFetch || (nativeFetch ? nativeFetch.bind(window) : undefined);
            },
            set: function (newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          try {
            var orig = window.fetch;
            Object.defineProperty(window, 'fetch', {
              value: orig,
              writable: true,
              configurable: true,
              enumerable: true,
            });
          } catch (err) {}
        }
      })();
    </script>
